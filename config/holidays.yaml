# Holiday calendar used for business-day math.
#
# Business day (12 CFR 15.2, per the owner): any day other than a Saturday, Sunday, or
# Federal holiday. This file lists Federal holidays and the weekday on which each is
# observed. `observed` is the day treated as a non-business day; `null` means the holiday
# causes no weekday closure (for example a Saturday holiday under a Fedwire schedule).
#
# To use a Fedwire (Federal Reserve) schedule instead, point `holiday_calendar` in
# rules/rules.yaml at another file of the same shape with kind: fedwire.
#
# `covers` is the date range this file is authoritative for. Dates outside it are an
# error, never silently treated as business days.
#
# verified: true. All 23 observed dates below were compared with the OPM "Federal Holidays"
# schedules for 2026, 2027 and 2028 on 2026-11-08 and match exactly. The dates in this file
# cover a limited range (see `covers`); extend and re-verify it before it runs out.
schema_version: 1
name: US Federal holidays
kind: federal
source: "5 U.S.C. 6103(a); OPM Federal Holidays schedule, https://www.opm.gov/policy-data-oversight/pay-leave/federal-holidays/ (compared 2026-11-08)"
verified: true
notes: >-
  A holiday on a Saturday is observed the preceding Friday (5 U.S.C. 6103(b)); on a Sunday, the
  following Monday (Executive Order 11582). New Year's Day 2028 (Saturday) is observed Friday
  2027-12-31, inside this range. This is the Federal employee holiday schedule, not the Federal
  Reserve's: the Federal Reserve does not observe that Friday closure, so a Fedwire file would differ.
covers:
  from: "2026-01-01"
  to: "2027-12-31"
holidays:
  - { name: "New Year's Day", date: "2026-01-01", observed: "2026-01-01" }
  - { name: "Birthday of Martin Luther King, Jr.", date: "2026-01-19", observed: "2026-01-19" }
  - { name: "Washington's Birthday", date: "2026-02-16", observed: "2026-02-16" }
  - { name: "Memorial Day", date: "2026-05-25", observed: "2026-05-25" }
  - { name: "Juneteenth National Independence Day", date: "2026-06-19", observed: "2026-06-19" }
  - { name: "Independence Day", date: "2026-07-04", observed: "2026-07-03" }
  - { name: "Labor Day", date: "2026-09-07", observed: "2026-09-07" }
  - { name: "Columbus Day", date: "2026-10-12", observed: "2026-10-12" }
  - { name: "Veterans Day", date: "2026-11-11", observed: "2026-11-11" }
  - { name: "Thanksgiving Day", date: "2026-11-26", observed: "2026-11-26" }
  - { name: "Christmas Day", date: "2026-12-25", observed: "2026-12-25" }
  - { name: "New Year's Day", date: "2027-01-01", observed: "2027-01-01" }
  - { name: "Birthday of Martin Luther King, Jr.", date: "2027-01-18", observed: "2027-01-18" }
  - { name: "Washington's Birthday", date: "2027-02-15", observed: "2027-02-15" }
  - { name: "Memorial Day", date: "2027-05-31", observed: "2027-05-31" }
  - { name: "Juneteenth National Independence Day", date: "2027-06-19", observed: "2027-06-18" }
  - { name: "Independence Day", date: "2027-07-04", observed: "2027-07-05" }
  - { name: "Labor Day", date: "2027-09-06", observed: "2027-09-06" }
  - { name: "Columbus Day", date: "2027-10-11", observed: "2027-10-11" }
  - { name: "Veterans Day", date: "2027-11-11", observed: "2027-11-11" }
  - { name: "Thanksgiving Day", date: "2027-11-25", observed: "2027-11-25" }
  - { name: "Christmas Day", date: "2027-12-25", observed: "2027-12-24" }
  - { name: "New Year's Day", date: "2028-01-01", observed: "2027-12-31" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reservewatch"
version = "0.1.0"
description = "Auditable monitoring and reporting aid for permitted payment stablecoin issuer reserve data. Not legal advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
reservewatch = "reservewatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reservewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
